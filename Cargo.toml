[package]
name = "voxel-native"
version = "0.1.0"
edition = "2021"
description = "Native voxel engine (successor to R93G) — Rust + Bevy + WGPU"

[dependencies]
# Core engine: Bevy with default features (Vulkan/DX12/Metal via wgpu).
# Note: dynamic_linking is incompatible with bevy_egui on Windows, so we
# disable it. Dev builds stay fast because of the opt-level tweaks below.
bevy = "0.14"

# Noise / terrain generation (same ideas as R93G's terrain.ts).
noise = "0.9"

# Fast hash maps for chunk lookup (chunk coords -> chunk data).
ahash = "0.8"

# Serialization for save/load of worlds + settings.
serde = { version = "1", features = ["derive"] }
ron  = "0.8"

# Deterministic RNG for world seeds.
rand = "0.8"
rand_chacha = "0.3"

# Polling async tasks returned by Bevy's AsyncComputeTaskPool.
futures-lite = "2"

# PNG encode/decode for the in-game Texture Viewer (export baked textures,
# load user-supplied overrides from ./textures/). `default-features=false`
# keeps compile times sane — we only need PNG.
image = { version = "0.25", default-features = false, features = ["png"] }

# Transitive pin: bevy_asset 0.14 wants blake3 ^1.5. blake3 1.8.3+ uses
# edition2024 (Rust 1.85+), which makes older cargo fail at *manifest parse*
# (`feature edition2024 is required`). 1.8.2 is the newest 2021-edition release.
blake3 = "=1.8.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# In-game editor / debug panels (F3).
bevy_egui = "0.28"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Clipboard support currently depends on unstable web-sys APIs that do not
# match this Bevy/egui stack, so the browser build keeps egui rendering and
# fonts but disables clipboard/open-url integration.
bevy_egui = { version = "0.28", default-features = false, features = ["default_fonts", "render"] }
# Browser builds need getrandom's JS backend for Bevy/wgpu dependencies
# that request random IDs internally.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
uuid = { version = "1", features = ["rng-getrandom"] }
web-sys = { version = "0.3", features = ["Storage", "Window"] }

# ---- Build profiles --------------------------------------------------------
# Dev builds: fast compile, but optimize the hot render/engine deps so the
# editor is actually playable. This is the standard Bevy recipe.
# `debug = "line-tables-only"` keeps panic backtraces useful while
# slashing link time vs full DWARF.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Release builds: maximum runtime performance, smaller binary.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
