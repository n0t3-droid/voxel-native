<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic city-site filtering and weighted scoring</title>
  <desc id="desc">A source-backed flow for autonomous city placement. Candidate footprints first pass six hard filters: primary bounds, loaded anchor, no reserved footprint, no blocked road corridor, no blocked city footprint for a road, and no duplicate existing road corridor. Remaining candidates receive an interpretable weighted score from flatness, road access, district balance, route fit, block fit, road-anchor alignment, semantic anchor, and centre distance, then deterministic total ordering selects the maximum. The weights are project-authored heuristics, not physical constants.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071217"/>
      <stop offset="1" stop-color="#0d1d24"/>
    </linearGradient>
    <linearGradient id="gateFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123138"/>
      <stop offset="1" stop-color="#0d222a"/>
    </linearGradient>
    <linearGradient id="scoreFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b35"/>
      <stop offset="1" stop-color="#0c2028"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8cb8c6" stroke-opacity="0.04"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#61e8cb"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7896a0"/>
    </marker>
    <style>
      .kicker{font-family:Helvetica;font-size:17px;font-weight:bold;letter-spacing:4px;fill:#73f4d4}
      .heading{font-family:Helvetica;font-size:38px;font-weight:bold;fill:#f2fbff}
      .subhead{font-family:Helvetica;font-size:20px;font-weight:normal;fill:#9dbdc9}
      .panelTitle{font-family:Helvetica;font-size:20px;font-weight:bold;fill:#edf9fd}
      .body{font-family:Helvetica;font-size:16px;font-weight:normal;fill:#abc5ce}
      .mono{font-family:Courier;font-size:16px;font-weight:bold;fill:#d7e9ee}
      .micro{font-family:Courier;font-size:13px;font-weight:bold;fill:#809ea9}
      .weight{font-family:Courier;font-size:17px;font-weight:bold;fill:#77efd2}
    </style>
  </defs>

  <rect width="1600" height="940" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="940" rx="24" fill="url(#grid)"/>

  <g font-family="Helvetica">
    <text x="64" y="64" class="kicker">AUTONOMOUS CONSTRUCTION · LIVE PROJECT-AUTHORED HEURISTIC</text>
    <text x="64" y="116" class="heading">Hard gates first. Transparent scoring second.</text>
    <text x="64" y="153" class="subhead">Hard spatial filters precede a bounded, deterministic weighted comparison.</text>

    <g transform="translate(1174 43)">
      <rect width="362" height="94" rx="15" fill="#0d2026" stroke="#52694e"/>
      <text x="20" y="33" fill="#d9efaa" font-size="14" font-weight="bold" letter-spacing="1.3">INTERPRETABLE · TESTABLE</text>
      <text x="20" y="60" fill="#f0c77b" font-size="14" font-weight="bold">NOT A PHYSICAL MODEL</text>
      <text x="20" y="81" fill="#8faab4" font-size="13">weights encode project design priorities</text>
    </g>

    <g transform="translate(64 210)">
      <rect width="420" height="464" rx="20" fill="url(#gateFill)" stroke="#4a817d" stroke-width="2"/>
      <rect x="22" y="20" width="132" height="27" rx="13" fill="#65e8ca"/>
      <text x="88" y="39" fill="#071418" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">HARD PREFILTER</text>
      <text x="24" y="81" class="panelTitle">Candidate footprint must be:</text>

      <g transform="translate(24 108)" class="body">
        <g transform="translate(0 0)"><rect width="18" height="18" rx="4" fill="#183f3d" stroke="#68e7ca"/><path d="M4 9L8 13L15 5" fill="none" stroke="#8af5dd" stroke-width="2"/><text x="31" y="15">inside primary bounds</text></g>
        <g transform="translate(0 43)"><rect width="18" height="18" rx="4" fill="#183f3d" stroke="#68e7ca"/><path d="M4 9L8 13L15 5" fill="none" stroke="#8af5dd" stroke-width="2"/><text x="31" y="15">anchored in loaded world data</text></g>
        <g transform="translate(0 86)"><rect width="18" height="18" rx="4" fill="#183f3d" stroke="#68e7ca"/><path d="M4 9L8 13L15 5" fill="none" stroke="#8af5dd" stroke-width="2"/><text x="31" y="15">outside reserved project footprints</text></g>
        <g transform="translate(0 129)"><rect width="18" height="18" rx="4" fill="#183f3d" stroke="#68e7ca"/><path d="M4 9L8 13L15 5" fill="none" stroke="#8af5dd" stroke-width="2"/><text x="31" y="15">clear of protected road corridors</text></g>
        <g transform="translate(0 172)"><rect width="18" height="18" rx="4" fill="#183f3d" stroke="#68e7ca"/><path d="M4 9L8 13L15 5" fill="none" stroke="#8af5dd" stroke-width="2"/><text x="31" y="15">not blocking city footprint (road)</text></g>
        <g transform="translate(0 215)"><rect width="18" height="18" rx="4" fill="#183f3d" stroke="#68e7ca"/><path d="M4 9L8 13L15 5" fill="none" stroke="#8af5dd" stroke-width="2"/><text x="31" y="15">not duplicating an existing corridor</text></g>
      </g>

      <path d="M210 360V389" fill="none" stroke="#7896a0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowMuted)"/>
      <rect x="68" y="397" width="284" height="44" rx="12" fill="#2b2024" stroke="#a55c67"/>
      <text x="210" y="425" text-anchor="middle" fill="#f0a3ae" font-size="15" font-weight="bold" letter-spacing="1.3">FAILED GATE → FILTERED OUT</text>
    </g>

    <path d="M484 442H542" fill="none" stroke="#61e8cb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="513" y="426" text-anchor="middle" fill="#84acb4" font-size="13" font-weight="bold">PASS</text>

    <g transform="translate(556 210)">
      <rect width="632" height="464" rx="20" fill="url(#scoreFill)" stroke="#4a85a5" stroke-width="2"/>
      <rect x="22" y="20" width="155" height="27" rx="13" fill="#173d52" stroke="#5fb8e9"/>
      <text x="99" y="39" fill="#a9dcff" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">WEIGHTED SCORE</text>
      <text x="24" y="81" class="panelTitle">Valid-site composite</text>
      <text x="24" y="107" class="body">Normalized terms stay visible; the centre term gently prefers compact plans.</text>

      <g transform="translate(24 137)">
        <rect width="584" height="286" rx="15" fill="#0a1b21" stroke="#31515a"/>
        <text x="20" y="36" class="mono" fill="#f1fbff">site_score =</text>
        <g transform="translate(31 68)">
          <text class="weight">+ 2.50</text><text x="86" class="mono">flatness</text>
          <text y="31" class="weight">+ 2.40</text><text x="86" y="31" class="mono">road_access</text>
          <text y="62" class="weight">+ 1.80</text><text x="86" y="62" class="mono">district_balance</text>
          <text y="93" class="weight">+ 1.35</text><text x="86" y="93" class="mono">route_fit</text>

          <text x="290" class="weight">+ 0.55</text><text x="376" class="mono">block_fit</text>
          <text x="290" y="31" class="weight">+ 4.00</text><text x="365" y="31" class="micro">road_anchor_alignment</text>
          <text x="290" y="62" class="weight">+ 2.50</text><text x="376" y="62" class="mono">semantic_anchor</text>
          <text x="290" y="93" fill="#f0c77b" class="weight">− 0.0005</text><text x="401" y="93" class="mono">centre_distance</text>
        </g>
        <path d="M20 191H564" stroke="#31515a"/>
        <text x="20" y="222" class="micro">road_access = 0.35 * proximity + 0.65 * frontage</text>
        <text x="20" y="250" class="micro">alignment = clamp((|dot| − 0.72) / 0.28) * clamp(1 − distance / 24)</text>
        <text x="20" y="274" fill="#8fb3bd" font-size="13">Project-kind branches set inapplicable terms to fixed neutral values.</text>
      </g>
    </g>

    <path d="M1188 442H1230" fill="none" stroke="#61e8cb" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(1244 210)">
      <rect width="292" height="464" rx="20" fill="#0b1b20" stroke="#60734d" stroke-width="2"/>
      <rect x="20" y="20" width="116" height="27" rx="13" fill="#283a28" stroke="#afdc72"/>
      <text x="78" y="39" fill="#d9f3aa" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">SELECTION</text>
      <text x="22" y="82" class="panelTitle">Choose the maximum</text>
      <text x="22" y="111" class="body">The same candidate order and</text>
      <text x="22" y="134" class="body">world state replay the result.</text>

      <g transform="translate(22 171)">
        <rect width="248" height="99" rx="14" fill="#10262b" stroke="#4d6b60"/>
        <text x="124" y="38" text-anchor="middle" fill="#7debd0" font-size="17" font-weight="bold">max_by</text>
        <text x="124" y="68" text-anchor="middle" class="mono">sa.total_cmp(sb)</text>
      </g>

      <path d="M146 291V326" fill="none" stroke="#61e8cb" stroke-width="3" marker-end="url(#arrow)"/>
      <g transform="translate(22 340)">
        <rect width="248" height="84" rx="14" fill="#162826" stroke="#8bbd66"/>
        <circle cx="40" cy="42" r="17" fill="#b9e57d"/>
        <path d="M31 42L38 49L50 34" fill="none" stroke="#142117" stroke-width="4"/>
        <text x="70" y="38" fill="#ecf8d4" font-size="17" font-weight="bold">selected site</text>
        <text x="70" y="61" fill="#9fb9a4" font-size="14">bounded candidate set</text>
      </g>
    </g>

    <g transform="translate(64 710)">
      <rect width="1472" height="74" rx="16" fill="#171b20" stroke="#5a4b4e"/>
      <text x="24" y="29" fill="#f0c77b" font-size="15" font-weight="bold">BASE-HELPER SAFETY SENTINEL</text>
      <text x="320" y="29" class="mono">!inside_bounds OR !player_clearance → −10,000</text>
      <text x="24" y="55" fill="#94adb5" font-size="14">Candidate generation normally prefilters invalid sites; later composite terms mean −10,000 is not claimed as an exact final composite score.</text>
    </g>

    <g transform="translate(64 806)">
      <rect width="1472" height="88" rx="16" fill="#0a171c" stroke="#2a4852"/>
      <text x="24" y="29" fill="#d9edf3" font-size="15" font-weight="bold">ACCESS-ROAD ROUTE SUBSCORE</text>
      <text x="1418" y="29" text-anchor="end" fill="#8faab4" font-size="13">fewer than 2 heights → 0.5</text>
      <text x="24" y="57" class="mono">route_fit = clamp(1 − 0.55*clamp(avg_step/5) − 0.30*clamp(max_step/9) − 0.15*clamp(max(range−18,0)/34), 0, 1)</text>
      <text x="24" y="80" fill="#718f9a" font-size="13">Sources: src/bots.rs · docs/CODEX_ENGINEERING_ATLAS.md · docs/CITY_PLANNER_MATH.md</text>
    </g>
  </g>
</svg>
