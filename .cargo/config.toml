[target.x86_64-pc-windows-msvc]
# Use the bundled LLD linker. Roughly halves link time on Bevy vs the
# default `link.exe`. Ships with rustup, no install needed.
linker = "rust-lld.exe"

[target.wasm32-unknown-unknown]
rustflags = [
  '--cfg',
  'getrandom_backend="wasm_js"',
  '--cfg=web_sys_unstable_apis',
]

[build]
incremental = true
